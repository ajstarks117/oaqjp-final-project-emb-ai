<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Emotion Detector</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f5f7;
        margin: 0;
        padding: 40px;
      }
      .container {
        max-width: 700px;
        margin: 0 auto;
        background: white;
        padding: 24px;
        border-radius: 12px;
        box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      }
      h1 { color: #1f2937; }
      textarea {
        width: 100%;
        min-height: 120px;
        resize: vertical;
        font-size: 16px;
        padding: 12px;
        margin-top: 12px;
      }
      button {
        background: #2563eb;
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        margin-top: 12px;
      }
      .error {
        color: #b91c1c;
        margin-top: 12px;
        font-weight: bold;
      }
      .result {
        margin-top: 20px;
        border-top: 1px solid #d1d5db;
        padding-top: 16px;
      }
      .emotion-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 12px;
      }
      .emotion-item {
        background: #eef2ff;
        padding: 12px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Emotion Detector</h1>
      <form method="POST">
        <label for="text">Enter text to analyze:</label>
        <textarea id="text" name="text" placeholder="Type a sentence here...">{{ text or '' }}</textarea>
        <button type="submit">Analyze</button>
      </form>

      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}

      {% if result %}
      <div class="result">
        <h2>Emotion Results</h2>
        <div class="emotion-grid">
          {% for emotion in ['anger', 'disgust', 'fear', 'joy', 'sadness'] %}
          <div class="emotion-item">
            <strong>{{ emotion|capitalize }}:</strong> {{ result[emotion] }}
          </div>
          {% endfor %}
        </div>
        <p><strong>Dominant Emotion:</strong> {{ result['dominant_emotion'] }}</p>
      </div>
      {% endif %}
    </div>
  </body>
</html>
